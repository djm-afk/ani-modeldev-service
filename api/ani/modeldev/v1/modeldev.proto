syntax = "proto3";

package ani.modeldev.v1;

import "ani/training/v1/training.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/zhangzhe-ctrl/ani-modeldev-service/api/ani/modeldev/v1;modeldevv1";

// BFF-facing internal RPCs. Each call requires current actor authorization;
// the actor saved at admission is audit data, not permanent access permission.
service ModelDevQueryService {
  rpc ListImplementations(ListImplementationsRequest) returns (ListImplementationsResponse);
  rpc GetInputVersion(GetInputVersionRequest) returns (GetInputVersionResponse);
  rpc ListInputVersions(ListInputVersionsRequest) returns (ListInputVersionsResponse);
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE The registration recovery operation returns this same original execution projection.
  rpc GetExecution(GetExecutionRequest) returns (GetExecutionResponse);
  rpc ListExecutions(ListExecutionsRequest) returns (ListExecutionsResponse);
  rpc GetExecutionLogs(GetExecutionLogsRequest) returns (GetExecutionLogsResponse);
  // Server-streaming live logs of one already-authorized container. The first
  // frame is READY or REJECTED; later frames are DATA or the closing frame.
  rpc GetExecutionLogStream(GetExecutionLogStreamRequest) returns (stream GetExecutionLogStreamResponse);
  rpc ListExecutionArtifacts(ListExecutionArtifactsRequest) returns (ListExecutionArtifactsResponse);
  rpc AuthorizeArtifactDownload(AuthorizeArtifactDownloadRequest) returns (AuthorizeArtifactDownloadResponse);
  // Live Kubernetes views. These are real-time reads, never part of ExecutionView.
  rpc ListExecutionPods(ListExecutionPodsRequest) returns (ListExecutionPodsResponse);
  rpc ListExecutionEvents(ListExecutionEventsRequest) returns (ListExecutionEventsResponse);
}

// Only authenticated Governance may resolve a candidate after current actor
// authorization and an original-key miss. This service does not accept an
// execution or allocate command identities.
service ModelDevAdmissionService {
  rpc PrepareAdmission(PrepareAdmissionRequest) returns (PrepareAdmissionResponse);
  rpc FinalizeAdmission(FinalizeAdmissionRequest) returns (FinalizeAdmissionResponse);
}

// Only the authenticated Governance delivery identity may call this service.
// ACK is emitted after the command or close tombstone is durably committed.
service ModelDevCommandService {
  rpc AcceptExecution(AcceptExecutionRequest) returns (AcceptExecutionResponse);
  rpc ApplyCloseIntent(ApplyCloseIntentRequest) returns (ApplyCloseIntentResponse);
}

// Only authenticated managed KFP steps may call these capabilities. Claimed
// associations in requests must be verified against actual Run/Workflow/Pod
// identity; labels or caller-supplied IDs alone never authorize a callback.
service ModelDevStepService {
  rpc BeginExecution(BeginExecutionRequest) returns (BeginExecutionResponse);
  // Limited to COLLECT, PUBLISH and REGISTER. The execution owner persists
  // the first role window; replay never grants another business budget.
  rpc BeginManagedStep(BeginManagedStepRequest) returns (BeginManagedStepResponse);
  rpc GetExecutionConfiguration(GetExecutionConfigurationRequest) returns (GetExecutionConfigurationResponse);
  // Temporary object access is derived from the current execution snapshot.
  // Every refresh repeats the same workload and Run authority verification.
  rpc GetStorageCredentials(GetStorageCredentialsRequest) returns (GetStorageCredentialsResponse);
  rpc EnsureTraining(EnsureTrainingRequest) returns (EnsureTrainingResponse);
  rpc GetTrainingStatus(GetTrainingStatusRequest) returns (GetTrainingStatusResponse);
  rpc ReportStepResult(ReportStepResultRequest) returns (ReportStepResultResponse);
  rpc RequestExecutionClose(RequestExecutionCloseRequest) returns (RequestExecutionCloseResponse);
  // EXPORT/VERIFY startup shares execution-level arbitration with stop.
  // Replays return the original bounds and never grant another launch.
  rpc BeginFinetuningStep(BeginFinetuningStepRequest) returns (BeginFinetuningStepResponse);
  rpc ReportFinetuningStepResult(ReportFinetuningStepResultRequest) returns (ReportFinetuningStepResultResponse);
  // Confirms the original publish completion and object bytes before Model
  // registration. A dependency error preserves PUBLISHED and closes compute.
  rpc RegisterModel(RegisterModelRequest) returns (RegisterModelResponse);
}

message BeginFinetuningStepRequest {
  StepContext context = 1;
}

message BeginFinetuningStepResponse {
  bool start_permitted = 1;
  google.protobuf.Timestamp admitted_at = 2;
  google.protobuf.Timestamp deadline_at = 3;
}

message ReportFinetuningStepResultRequest {
  StepContext context = 1;
  google.protobuf.Timestamp started_at = 2;
  google.protobuf.Timestamp finished_at = 3;
  int32 exit_code = 4;
  ani.training.v1.ManifestRef result_manifest = 5;
}

// A result remains a candidate until the owner independently observes the
// original Pod terminal state and verifies the manifest bytes.
message ReportFinetuningStepResultResponse {
  ExecutionStates states = 1;
}

message RegisterModelRequest {
  StepContext context = 1;
}

message RegisterModelResponse {
  ExecutionStates states = 1;
  VerifiedPublication publication = 2;
}

enum ComputeState {
  COMPUTE_STATE_UNSPECIFIED = 0;
  COMPUTE_STATE_ACCEPTED = 1;
  COMPUTE_STATE_SUBMITTING = 2;
  COMPUTE_STATE_SUBMISSION_UNCERTAIN = 3;
  COMPUTE_STATE_QUEUED = 4;
  COMPUTE_STATE_PREPARING = 5;
  COMPUTE_STATE_TRAINING = 6;
  COMPUTE_STATE_SUCCEEDED = 7;
  COMPUTE_STATE_FAILED = 8;
  COMPUTE_STATE_CANCELED = 9;
  // The original attempt has a local no-send observation and no stronger
  // submission observation. This state does not grant permission to resend.
  COMPUTE_STATE_SUBMISSION_NOT_SENT = 10;
  // One or more Run creation observations are retained. This establishes
  // neither Run authority nor queued/running computation, even for one Run.
  COMPUTE_STATE_SUBMISSION_CONFIRMED = 11;
}

enum DeliveryState {
  DELIVERY_STATE_UNSPECIFIED = 0;
  DELIVERY_STATE_PENDING = 1;
  DELIVERY_STATE_PUBLISHING = 2;
  DELIVERY_STATE_PUBLISHED = 3;
  DELIVERY_STATE_FAILED = 4;
}

enum ResourceState {
  RESOURCE_STATE_UNSPECIFIED = 0;
  RESOURCE_STATE_NOT_APPLICABLE = 1;
}

enum CloseState {
  CLOSE_STATE_UNSPECIFIED = 0;
  CLOSE_STATE_OPEN = 1;
  CLOSE_STATE_CLOSING = 2;
  CLOSE_STATE_CLOSED = 3;
  CLOSE_STATE_NEEDS_REVIEW = 4;
}

enum CloseReason {
  CLOSE_REASON_UNSPECIFIED = 0;
  CLOSE_REASON_USER_STOP = 1;
  CLOSE_REASON_DEADLINE = 2;
  CLOSE_REASON_NATURAL_TERMINAL = 3;
  CLOSE_REASON_STEP_FAILED = 4;
}

enum InputState {
  INPUT_STATE_UNSPECIFIED = 0;
  INPUT_STATE_FIXING = 1;
  INPUT_STATE_VALIDATING = 2;
  INPUT_STATE_READY = 3;
  INPUT_STATE_FAILED = 4;
}

enum PipelineStep {
  PIPELINE_STEP_UNSPECIFIED = 0;
  PIPELINE_STEP_PREPARE = 1;
  PIPELINE_STEP_TRAIN_WAIT = 2;
  PIPELINE_STEP_COLLECT = 3;
  PIPELINE_STEP_PUBLISH = 4;
  PIPELINE_STEP_CLOSE = 5;
  PIPELINE_STEP_EXPORT = 6;
  PIPELINE_STEP_VERIFY = 7;
  PIPELINE_STEP_REGISTER = 8;
}

enum ExternalCreateState {
  EXTERNAL_CREATE_STATE_UNSPECIFIED = 0;
  EXTERNAL_CREATE_STATE_INTENT_RECORDED = 1;
  EXTERNAL_CREATE_STATE_IN_FLIGHT = 2;
  EXTERNAL_CREATE_STATE_UNCERTAIN = 3;
  EXTERNAL_CREATE_STATE_CONFIRMED = 4;
  EXTERNAL_CREATE_STATE_REJECTED_WITHOUT_SIDE_EFFECT = 5;
}

enum ParameterType {
  PARAMETER_TYPE_UNSPECIFIED = 0;
  PARAMETER_TYPE_STRING = 1;
  PARAMETER_TYPE_INTEGER = 2;
  PARAMETER_TYPE_BOOLEAN = 3;
  PARAMETER_TYPE_DECIMAL = 4;
}

// Stable domain reasons mapped to the repository's ordinary gRPC error model.
enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  ERROR_REASON_INVALID_ARGUMENT = 1;
  ERROR_REASON_UNAUTHENTICATED = 2;
  ERROR_REASON_FORBIDDEN = 3;
  ERROR_REASON_RESOURCE_NOT_FOUND = 4;
  ERROR_REASON_IDEMPOTENCY_CONFLICT = 5;
  ERROR_REASON_ENVIRONMENT_NOT_READY = 6;
  reserved 7;
  reserved "ERROR_REASON_NO_COMPATIBLE_RELEASE";
  ERROR_REASON_UPSTREAM_UNAVAILABLE = 8;
  ERROR_REASON_SUBMISSIONS_PAUSED = 9;
  ERROR_REASON_CAPABILITY_NOT_ENABLED = 10;
  ERROR_REASON_MANUAL_REVIEW_REQUIRED = 11;
  ERROR_REASON_EXECUTION_CLOSING = 12;
  ERROR_REASON_ARTIFACT_NOT_PUBLISHED = 13;
  ERROR_REASON_AUTHORITY_MISMATCH = 14;
  ERROR_REASON_COMMAND_CONFLICT = 15;
  ERROR_REASON_TRAINING_FAILED = 16;
  ERROR_REASON_REQUIRED_OUTPUT_MISSING = 17;
  ERROR_REASON_INTEGRITY_MISMATCH = 18;
  ERROR_REASON_UPSTREAM_RESULT_UNCERTAIN = 19;
  ERROR_REASON_DEADLINE_EXCEEDED = 20;
  ERROR_REASON_INPUT_TOO_LARGE = 21;
  ERROR_REASON_INPUT_NOT_READY = 22;
  ERROR_REASON_IMPLEMENTATION_UNAVAILABLE = 23;
  ERROR_REASON_UNSUPPORTED_DEVICE = 24;
  ERROR_REASON_ADMISSION_PLAN_MISMATCH = 25;
}

message FieldViolation {
  string field = 1;
  string reason = 2;
}

// RPC failures use standard gRPC status details, never successful envelopes.
// Query views may also carry this type as a historical failure diagnostic.
// safe_message excludes credentials, storage secrets, and hidden object facts.
message ErrorDetail {
  ErrorReason reason = 1;
  string safe_message = 2;
  repeated FieldViolation violations = 3;
  string correlation_id = 4;
}

// Shared typed intent, not a new HTTP facade. Governance owns CreateExecution
// and StopExecution at the existing BFF. Its strict JSON adapter keeps the
// implementation-specific parameters object and maps field presence to
// this message; direct proto-JSON translation is not the external API contract.
// Tenant, actor, action, and idempotency key belong to the trusted admission
// scope and do not participate in the canonical intent object.
message UserIntent {
  reserved 3, 5, 6, 7, 9;
  reserved "preset_id", "image_version_id", "general_parameters", "source_execution_id", "finetuning";
  string name = 1;
  ani.training.v1.ExecutionKind kind = 2;
  string dataset_version_id = 4;
  optional string base_model_version_id = 8;
  optional string target_model_id = 10;
  optional string new_model_name = 11;
  string implementation_id = 12;
  string compute_preset_id = 13;
  oneof parameters { MLPParameters mlp = 14; FinetuningParameters sft_lora = 15; }
  optional uint64 timeout_seconds = 16;
}

message MLPParameters {
 optional string learning_rate = 1; optional int64 epochs = 2; optional int64 batch_size = 3; optional uint32 seed = 4;
}
message FinetuningParameters {
 optional string learning_rate = 1; optional int64 max_steps = 2;
 optional int64 per_device_train_batch_size = 3; optional int64 gradient_accumulation_steps = 4;
 optional int64 cutoff_len = 5; optional int64 lora_rank = 6; optional int64 lora_alpha = 7;
 optional string lora_dropout = 8; optional uint32 seed = 9;
}

message ParameterSelection { repeated ani.training.v1.Parameter values = 1; }

message ExecutionStates {
  ComputeState compute_state = 1;
  DeliveryState delivery_state = 2;
  ResourceState resource_state = 3;
  CloseState close_state = 4;
}

// Page-window pagination aligned with the Governance page/pageSize baseline.
// An absent page or page_size resolves independently to 1 or 20; lists use a
// deterministic order and callers may jump to any valid page.
message PageRequest {
  reserved 1, 2;
  reserved "limit", "cursor";
  optional uint32 page = 3;
  optional uint32 page_size = 4;
}

message ParameterRule {
  string name = 1;
  ParameterType type = 2;
  bool required = 3;
  ani.training.v1.Parameter default_value = 4;
  repeated ani.training.v1.Parameter allowed_values = 5;
  ani.training.v1.Parameter minimum = 6;
  ani.training.v1.Parameter maximum = 7;
  optional bool minimum_inclusive = 8;
  optional bool maximum_inclusive = 9;
  bool editable = 10;
  string non_editable_reason = 11;
  string numeric_representation = 12;
  string validation_description = 13;
}

message ImplementationView {
 string implementation_id = 1; string name = 2; ani.training.v1.ExecutionKind kind = 3;
 string version = 4; string parameter_contract_version = 5; repeated ParameterRule parameter_rules = 6;
 repeated string supported_device_modes = 7; bool available = 8;
 uint64 execution_timeout_default_seconds = 9; uint64 execution_timeout_max_seconds = 10; uint64 step_timeout_seconds = 11;
}
// An absent kind returns every implementation. A specified kind is applied
// before Total and the page window, and UNSPECIFIED is rejected rather than
// treated as a filter.
message ListImplementationsRequest {
  PageRequest page = 1;
  optional ani.training.v1.ExecutionKind kind = 2;
}
message ListImplementationsResponse { repeated ImplementationView implementations = 1; uint64 total = 2; }

// Public metadata omits backend object keys and credentials.
message InputVersionView {
  string input_version_id = 1;
  InputState state = 2;
  string format = 3;
  int64 size_bytes = 4;
  string sha256 = 5;
  uint32 row_count = 6;
  uint32 feature_count = 7;
  google.protobuf.Timestamp created_at = 8;
  ErrorDetail failure = 9;
}

message GetInputVersionRequest {
  string input_version_id = 1;
}

message GetInputVersionResponse {
  InputVersionView input_version = 1;
}

message ListInputVersionsRequest {
  PageRequest page = 1;
  optional InputState state = 2;
  // Restricts the page to one verified input format before Total is counted.
  // Compatibility is decided by the format alone: CSV feeds general training,
  // JSON feeds finetuning. An unrecognized value is rejected instead of
  // matching nothing.
  optional string format = 3;
}

message ListInputVersionsResponse {
  repeated InputVersionView input_versions = 1;
  reserved 2;
  reserved "next_cursor";
  // Matching total under the same tenant and filters, independent of the window.
  uint64 total = 3;
}

message ExecutionView {
  ani.training.v1.ExecutionIdentity identity = 1;
  string name = 2;
  ani.training.v1.ExecutionKind kind = 3;
  reserved 4, 5;
  reserved "preset_id", "release_id";
  string input_version_id = 6;
  string image_version_id = 7;
  ExecutionStates states = 8;
  PipelineStep current_step = 9;
  bool stop_requested = 10;
  uint64 close_generation = 11;
  google.protobuf.Timestamp accepted_at = 12;
  google.protobuf.Timestamp deadline_at = 13;
  google.protobuf.Timestamp observed_at = 14;
  ErrorDetail failure = 15;
  repeated ani.training.v1.Metric metrics = 16;
  reserved 17, 18;
  reserved "source_execution_id", "release_digest";
  string parameter_contract_version = 19;
  FinetuningParameters explicit_finetuning = 20;
  repeated ani.training.v1.Parameter resolved_parameters = 21;
  FinetuningManagedSettings managed_settings = 22;
  string resolved_configuration_sha256 = 23;
  string implementation_id = 24;
  string compute_preset_id = 25;
  ComputeOrigin compute_origin = 26;
  ExecutionTiming timing = 27;
  MLPParameters explicit_mlp = 28;
  ModelRegistrationView model_registration = 29;
  ExecutionHistoryView history = 30;
  // Complete ordered step sequence for timeline rendering. The set depends on
  // kind; close is always last.
  repeated StepProgress steps = 31;
  // Base model the finetuning started from, frozen at acceptance. Only the
  // identity facts are published: the object key, storage scope and file list
  // stay owner-internal. Absent for general training.
  BaseModelIdentity base_model = 32;
}

// BaseModelIdentity is the publishable half of BaseModelRef. It names the base
// model without revealing where the owner keeps its bytes.
message BaseModelIdentity {
  string model_id = 1;
  string version_id = 2;
  string family = 3;
  string format = 4;
}

// StepProgress is one entry of the ordered execution timeline. Role names the
// pipeline step; state is one of PENDING, RUNNING, SUCCEEDED, FAILED, STOPPED.
message StepProgress {
  string role = 1;
  string state = 2;
  google.protobuf.Timestamp started_at = 3;
  // Absent while the step has not finished; the client derives elapsed time.
  google.protobuf.Timestamp finished_at = 4;
  // Only export and verify report a real process exit code.
  int32 exit_code = 5;
  google.protobuf.Timestamp deadline_at = 6;
}

enum KfpRunTerminalState {
  KFP_RUN_TERMINAL_STATE_UNSPECIFIED = 0;
  KFP_RUN_TERMINAL_STATE_SUCCEEDED = 1;
  KFP_RUN_TERMINAL_STATE_FAILED = 2;
  KFP_RUN_TERMINAL_STATE_CANCELED = 3;
}

enum WorkflowTerminalPhase {
  WORKFLOW_TERMINAL_PHASE_UNSPECIFIED = 0;
  WORKFLOW_TERMINAL_PHASE_SUCCEEDED = 1;
  WORKFLOW_TERMINAL_PHASE_FAILED = 2;
  WORKFLOW_TERMINAL_PHASE_ERROR = 3;
}

// Original controller evidence persisted at compute closure. Model registration
// recovery cannot replace this history. Missing terminal evidence stays absent.
message ExecutionHistoryView {
  string run_id = 1;
  string workflow_uid = 2;
  google.protobuf.Timestamp observed_at = 3;
  KfpRunTerminalState run_state = 4;
  google.protobuf.Timestamp run_finished_at = 5;
  WorkflowTerminalPhase workflow_phase = 6;
  google.protobuf.Timestamp workflow_finished_at = 7;
  string workflow_resource_version = 8;
  string workflow_nodes_sha256 = 9;
}

// Projection of the original persisted registration and verified receipt.
// Queries never fill this view by making a live Model write or lookup.
message ModelRegistrationView {
  string state = 1;
  string registration_id = 2;
  string model_id = 3;
  string model_version_id = 4;
  string failure_code = 5;
}

message GetExecutionRequest {
  string execution_id = 1;
}

message GetExecutionResponse {
  ExecutionView execution = 1;
}

message ListExecutionsRequest {
  PageRequest page = 1;
  optional ComputeState compute_state = 2;
  optional DeliveryState delivery_state = 3;
  optional CloseState close_state = 4;
  // Case-insensitive substring of the admitted execution name. Filtering
  // happens before the page window, so total reports the matching count.
  optional string name = 5;
  // An absent kind returns every execution. A specified kind is applied before
  // Total and the page window, and UNSPECIFIED is rejected rather than treated
  // as "no filter".
  optional ani.training.v1.ExecutionKind kind = 6;
}

message ListExecutionsResponse {
  repeated ExecutionView executions = 1;
  reserved 2;
  reserved "next_cursor";
  // Matching total under the same tenant and filters, independent of the window.
  uint64 total = 3;
}

message GetExecutionLogsRequest {
  string execution_id = 1;
  // Only an owner-issued log ID for this execution; never an arbitrary Pod.
  optional string log_id = 2;
  uint32 tail_lines = 3;
  uint32 max_bytes = 4;
  // Container selection stays outside the opaque log ID. An absent pod_uid
  // keeps the single-worker behaviour; an absent container keeps `node`.
  optional string pod_uid = 5;
  optional string container = 6;
  // Reads the last terminated instance of the same container.
  optional bool previous = 7;
}

message LogLine {
  google.protobuf.Timestamp timestamp = 1;
  string text = 2;
}

enum LogSourceKind {
  LOG_SOURCE_KIND_UNSPECIFIED = 0;
  LOG_SOURCE_KIND_TRAINER = 1;
  LOG_SOURCE_KIND_KFP_STEP = 2;
}

message GetExecutionLogsResponse {
  ani.training.v1.LogRef source = 1;
  repeated LogLine lines = 2;
  bool truncated = 3;
  google.protobuf.Timestamp observed_at = 4;
  LogSourceKind source_kind = 5;
  string container_name = 6;
  bool previous = 7;
  bool available = 8;
}

// Server-streamed frame kinds. READY precedes every DATA frame; a stream that
// cannot continue closes with CLOSED or REJECTED instead of ending silently.
enum FrameKind {
  FRAME_KIND_UNSPECIFIED = 0;
  FRAME_KIND_READY = 1;
  FRAME_KIND_DATA = 2;
  FRAME_KIND_CLOSED = 3;
  FRAME_KIND_REJECTED = 4;
}

message GetExecutionLogStreamRequest {
  string execution_id = 1;
  optional string pod_uid = 2;
  optional string container = 3;
  optional bool previous = 4;
  // Reconnect offset: the last server offset received before reconnecting; 0
  // starts from the log head. The server owns offsets and rejects stale ones.
  optional int64 since_bytes = 5;
}

message GetExecutionLogStreamResponse {
  FrameKind kind = 1;
  bytes data = 2;
  // REJECTED/CLOSED reason: POD_GONE, LOG_UNAVAILABLE, OFFSET_INVALID, ...
  string reason = 3;
  // Server-side count of bytes already sent for this stream, used to resume.
  int64 offset = 4;
  // Set when a rotation or Pod replacement makes an exact resume unprovable.
  bool gap = 5;
}

message ArtifactView {
  string artifact_id = 1;
  string execution_id = 2;
  string filename = 3;
  ani.training.v1.FileRole role = 4;
  int64 size_bytes = 5;
  string sha256 = 6;
  DeliveryState delivery_state = 7;
  google.protobuf.Timestamp verified_at = 8;
}

message ListExecutionArtifactsRequest {
  string execution_id = 1;
  PageRequest page = 2;
}

message ListExecutionArtifactsResponse {
  repeated ArtifactView artifacts = 1;
  reserved 2;
  reserved "next_cursor";
  // Matching total under the same tenant and filters, independent of the window.
  uint64 total = 3;
}

message AuthorizeArtifactDownloadRequest {
  string artifact_id = 1;
}

message AuthorizeArtifactDownloadResponse {
  ArtifactView artifact = 1;
  // Short-lived secret: redact from logs and never persist in a snapshot.
  string download_url = 2;
  google.protobuf.Timestamp expires_at = 3;
}

// PodLayer separates the Trainer worker execution plane from the KFP
// orchestration plane. They are never mixed into one training-instance list.
enum PodLayer {
  POD_LAYER_UNSPECIFIED = 0;
  POD_LAYER_TRAINER = 1;
  POD_LAYER_PIPELINE = 2;
  POD_LAYER_ALL = 3;
}

// PodAvailability carries evidence the Pod phase cannot express. Recycled and
// never-created are not Kubernetes phases and are never written into phase.
enum PodAvailability {
  POD_AVAILABILITY_UNSPECIFIED = 0;
  POD_AVAILABILITY_LIVE = 1;
  POD_AVAILABILITY_RECYCLED = 2;
  POD_AVAILABILITY_NEVER_CREATED = 3;
  POD_AVAILABILITY_REJECTED = 4;
  POD_AVAILABILITY_ORPHANED = 5;
  POD_AVAILABILITY_CREATION_PENDING = 6;
}

message ContainerView {
  string name = 1;
  // container / init_container / ephemeral
  string type = 2;
  // running / waiting / terminated / unknown
  string state = 3;
  string reason = 4;
  string message = 5;
  int32 restart_count = 6;
  // Present only while the container is terminated.
  optional int32 exit_code = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp finished_at = 9;
  // Last terminated instance, for CrashLoop and restart diagnosis.
  ContainerView last_state = 10;
}

message PodView {
  string pod_name = 1;
  string pod_uid = 2;
  string pod_ip = 3;
  // Kubernetes phase only: Pending/Running/Succeeded/Failed/Unknown.
  string phase = 4;
  bool ready = 5;
  string node_name = 6;
  int32 restarts = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp start_time = 9;
  google.protobuf.Timestamp deletion_timestamp = 10;
  PodLayer layer = 11;
  PodAvailability availability = 12;
  // KFP step name; empty for a Trainer worker.
  string step_name = 13;
  // JobSet restart attempt.
  int32 attempt = 14;
  // Job completion index for multi-node executions.
  int32 job_index = 15;
  // Opaque owner-issued log ID; container selection stays a separate field.
  string log_id = 16;
  bool log_available = 17;
  repeated ContainerView containers = 18;
  repeated ContainerView init_containers = 19;
  bool api_present = 20;
  // Worker node container exit code, when it terminated.
  optional int32 exit_code = 21;
  repeated ContainerView ephemeral_containers = 22;
  // the metric instance this Pod reports under, taken from the verified
  // ani.io/instance-id label: the execution ID for a Trainer worker, the KFP
  // run ID for a pipeline step. Empty when the Pod predates metric labelling,
  // so a consumer must treat it as unavailable rather than substitute one.
  string metric_instance_id = 23;
}

message EventView {
  string type = 1;
  string reason = 2;
  string message = 3;
  google.protobuf.Timestamp first_timestamp = 4;
  google.protobuf.Timestamp last_timestamp = 5;
  int32 count = 6;
  // source.component, falling back to reportingComponent.
  string source = 7;
  string involved_kind = 8;
  string involved_name = 9;
  string involved_uid = 10;
  string field_path = 11;
  string reporting_instance = 12;
}

message ListExecutionPodsRequest {
  string execution_id = 1;
  // Unspecified behaves as ALL.
  PodLayer layer = 2;
  bool include_recycled = 3;
}

message ListExecutionPodsResponse {
  repeated PodView pods = 1;
  google.protobuf.Timestamp observed_at = 2;
  // Overall evidence for this execution: LIVE/RECYCLED/NEVER_CREATED/...
  PodAvailability availability = 3;
}

message ListExecutionEventsRequest {
  string execution_id = 1;
  // key / all / warning; unspecified behaves as key.
  string scope = 2;
  // Equivalent to scope=warning, kept for older clients.
  bool warning_only = 3;
}

message ListExecutionEventsResponse {
  repeated EventView events = 1;
  google.protobuf.Timestamp observed_at = 2;
  // Kubernetes Event retention, e.g. "1h".
  string retention_hint = 3;
  bool truncated = 4;
}

// Approved identity references contain no certificate, token, or private key.
message RuntimeIdentityRefs {
  string modeldev_control_identity_ref = 1;
  string kfp_step_service_account = 2;
  string trainer_service_account = 3;
  string verifier_service_account = 4;
  string tenant_proxy_identity = 5;
}

message EnvironmentBindingSnapshot {
  string binding_id = 1;
  string binding_digest = 2;
  string cluster_id = 3;
  string namespace_name = 4;
  string namespace_uid = 5;
  string kfp_connection_ref = 6;
  string experiment_id = 7;
  RuntimeIdentityRefs identities = 8;
}

message StorageScope {
  string storage_connection_id = 1;
  string bucket = 2;
  string approved_prefix = 3;
  string credential_reference = 4;
}

// Immutable after Governance admission. Runtime IDs generated afterwards
// (Run, Workflow, Pod, PVC, TrainJob, JobSet) are deliberately absent.
// Hash canonicalization is a versioned business contract, not proto wire bytes.
message ExecutionSnapshot {
  string schema_version = 1;
  ani.training.v1.ExecutionKind kind = 2;
  ani.training.v1.DeliveryMode delivery_mode = 3;
  reserved 4;
  reserved "release";
  ani.training.v1.InputRef input = 5;
  ani.training.v1.ProgramRef program = 6;
  ani.training.v1.CPUResources resources = 7;
  EnvironmentBindingSnapshot environment = 8;
  ani.training.v1.WorkspaceContract workspace = 9;
  StorageScope publication_scope = 10;
  ani.training.v1.OutputContract output_contract = 11;
  google.protobuf.Timestamp deadline_at = 12;
  FinetuningSnapshot finetuning = 13;
  ImplementationSnapshot implementation = 14;
  IdentityRef identity_ref = 15;
  ComputeOrigin compute_origin = 16;
  ExecutionTiming timing = 17;
  RuntimePlan runtime_plan = 18;
  GPUPlan gpu = 19;
}

message StringPair { string key = 1; string value = 2; }
message GPUExecutionSnapshot {
  string scheduler_name = 1;
  string queue_name = 2;
  string runtime_class_name = 3;
  repeated StringPair node_selector = 4;
  repeated StringPair pod_annotations = 5;
  repeated StringPair resources = 6;
  string execution_digest = 7;
}
message GPUDisplaySnapshot {
  string profile_id = 1;
  uint64 profile_version = 2;
  string profile_name = 3;
  string model_key = 4;
  string mode = 5;
}
message GPUPlan {
  GPUExecutionSnapshot execution = 1;
  GPUDisplaySnapshot display = 2;
}

message FinetuningManagedSettings {
  string stage = 1;
  string finetuning_type = 2;
  string lora_target = 3;
  int64 lora_rank = 4;
  int64 lora_alpha = 5;
  int64 cutoff_len = 6;
  int64 per_device_train_batch_size = 7;
  int64 gradient_accumulation_steps = 8;
  int64 seed = 9;
  int64 data_seed = 10;
  string device = 11;
  bool fp16 = 12;
  bool bf16 = 13;
  string flash_attn = 14;
  string report_to = 15;
  string save_strategy = 16;
  string template = 17;
  string train_dtype = 18;
  string export_dtype = 19;
  string verify_dtype = 20;
  string lr_scheduler_type = 21;
  string warmup_ratio = 22;
  string weight_decay = 23;
  string lora_dropout = 24;
  int64 num_train_epochs = 25;
  string optim = 26;
  int64 logging_steps = 27;
}

message BaseModelFile {
  string path = 1;
  int64 size_bytes = 2;
  string sha256 = 3;
}

message BaseModelRef {
  string model_id = 1;
  string version_id = 2;
  string family = 3;
  string format = 4;
  ani.training.v1.FixedObjectRef object = 5;
  StorageScope scope = 6;
  repeated BaseModelFile files = 7;
}

message ComponentBudgets {
  reserved 1, 2, 3, 4, 5, 10;
  reserved "prepare_timeout_seconds", "export_timeout_seconds", "verify_timeout_seconds", "collect_timeout_seconds", "publish_timeout_seconds", "training_timeout_seconds";
  uint32 rpc_timeout_seconds = 6;
  int64 max_base_model_bytes = 7;
  int64 max_spool_bytes = 8;
  int64 max_base_model_expanded_bytes = 9;
}

message FinetuningSnapshot {
  string parameter_contract_version = 1;
  BaseModelRef base_model = 2;
  optional string target_model_id = 3;
  optional string new_model_name = 4;
  FinetuningManagedSettings managed_settings = 5;
  string resolved_configuration_sha256 = 6;
  ani.training.v1.ProgramRef export_program = 7;
  ani.training.v1.ProgramRef verify_program = 8;
  string recipe_sha256 = 9;
  string mapping_sha256 = 10;
  ComponentBudgets budgets = 11;
}

message IdentityRef {
 string tenant_id = 1; string actor = 2; string execution_id = 3; string operation_id = 4; string intent_hash = 5;
}
message ImplementationSnapshot {
 string implementation_id = 1; string version = 2; string parameter_contract_version = 3;
 string pipeline_id = 4; string pipeline_version_id = 5; string pipeline_ir_sha256 = 6;
}
message ComputeOrigin {
 string compute_preset_id = 1; string selection_digest = 2; bytes selection_canonical = 3;
 int64 cpu_millis = 4; int64 memory_mib = 5; string device_mode = 6;
}
message ExecutionTiming {
 google.protobuf.Timestamp accepted_at = 1; uint64 execution_timeout_seconds = 2;
 uint64 execution_timeout_max_seconds = 3; uint64 step_timeout_seconds = 4;
 google.protobuf.Timestamp execution_deadline_at = 5;
}
message RuntimePlan {
 string generator_version = 1; string api_group = 2; string kind = 3; string namespace = 4; string name = 5;
 bytes expected_spec_canonical = 6; string expected_spec_sha256 = 7; string defaulting_rules = 8; repeated string target_jobs = 9;
}
message PrepareAdmissionRequest {
 UserIntent intent = 1; IdentityRef identity_ref = 2; google.protobuf.Timestamp accepted_at = 3;
 bytes compute_selection_canonical = 4; string selection_digest = 5;
}
message PrepareAdmissionResponse { bytes candidate_canonical = 1; string candidate_hash = 2; }
message FinalizeAdmissionRequest {
 bytes candidate_canonical = 1; string candidate_hash = 2;
 optional bytes gpu_execution_canonical = 3; optional bytes gpu_display_canonical = 4;
}
message FinalizeAdmissionResponse { ExecutionSnapshot snapshot = 1; string execution_spec_hash = 2; }

message AcceptExecutionRequest {
  ani.training.v1.ExecutionIdentity identity = 1;
  // These trusted delivery claims must match the authenticated Governance
  // delegation. They are not fields in the user-facing CreateExecution body.
  // resource_tenant_id is a UUID; admitted_actor_id is a trusted audit string
  // governance:user:<id> or governance:access-key:<id>, not a UUID.
  string resource_tenant_id = 2;
  string admitted_actor_id = 3;
  string intent_hash = 4;
  ExecutionSnapshot snapshot = 5;
  google.protobuf.Timestamp accepted_at = 6;
  UserIntent intent = 7;
}

message AcceptExecutionResponse {
  ani.training.v1.ExecutionIdentity identity = 1;
  // Whether this Admission already existed, not whether its states changed.
  bool replayed = 2;
  ExecutionStates states = 3;
  // Nonzero committed execution-aggregate version from the same transaction
  // as states. Replays observe the current version without advancing it.
  // New facts fail atomically at uint64 maximum; existing facts remain readable.
  uint64 revision = 4;
}

message ApplyCloseIntentRequest {
  ani.training.v1.ExecutionIdentity identity = 1;
  string resource_tenant_id = 2;
  // Governance's durable source command sequence, used only for deduplication.
  // It is independent of the ModelDev-owned creation fence generation.
  uint64 intent_generation = 3;
  CloseReason reason = 4;
  google.protobuf.Timestamp requested_at = 5;
  // Trusted Governance audit identity; current authorization is checked before
  // Governance persists this intent, independently of the original actor.
  string requested_actor_id = 6;
}

message ApplyCloseIntentResponse {
  ani.training.v1.ExecutionIdentity identity = 1;
  // CLOSING reports the command's ModelDev-allocated monotonic creation fence.
  // CLOSED reports the generation of the already-confirmed terminal closure;
  // the command's distinct fence and source intent remain durably recorded.
  // Callers cannot supply either value or replace an earlier close's evidence.
  uint64 close_generation = 2;
  CloseState close_state = 3;
  bool replayed = 4;
  // True also permits a durable tombstone before AcceptExecution arrives.
  bool durably_recorded = 5;
}

message RunAssociation {
  string kfp_run_id = 1;
  string namespace_name = 2;
  string namespace_uid = 3;
  string workflow_name = 4;
  string workflow_uid = 5;
  string pod_name = 6;
  string pod_uid = 7;
}

message StepContext {
  ani.training.v1.ExecutionIdentity identity = 1;
  RunAssociation association = 2;
  PipelineStep step = 3;
}

message AuthorityBinding {
  string kfp_run_id = 1;
  string namespace_uid = 2;
  string workflow_uid = 3;
  google.protobuf.Timestamp bound_at = 4;
}

message BeginExecutionRequest {
  StepContext context = 1;
}

message BeginExecutionResponse {
  AuthorityBinding authority = 1;
  ExecutionStates states = 2;
  bool replayed = 3;
  StepTiming timing = 4;
}

message StepTiming {
  PipelineStep role = 1;
  google.protobuf.Timestamp admitted_at = 2;
  google.protobuf.Timestamp deadline_at = 3;
}

message BeginManagedStepRequest {
  StepContext context = 1;
}

message BeginManagedStepResponse {
  StepTiming timing = 1;
  bool replayed = 2;
}

message GetExecutionConfigurationRequest {
  StepContext context = 1;
}

message GetExecutionConfigurationResponse {
  ani.training.v1.ExecutionIdentity identity = 1;
  ExecutionSnapshot snapshot = 2;
  AuthorityBinding authority = 3;
  // Absent until the owner's verified prepare result binds the actual PVC UID.
  ani.training.v1.WorkspaceRef workspace = 4;
  ExecutionStates states = 5;
  // Immutable committed command envelope for authenticated managed component
  // canonicalization. Returning it grants no command delivery authority.
  AcceptExecutionRequest admission = 6;
  // Actual KFP logical task ID resolved from the authenticated current Pod,
  // frozen Run and Workflow membership; never supplied by a callback claim.
  string kfp_task_id = 7;
  // Read-only original role window; absent before this role was admitted.
  StepTiming timing = 8;
}

message GetStorageCredentialsRequest {
  StepContext context = 1;
  // PREPARE only: grants read access to this snapshot's one fixed base object.
  // No caller-supplied model, endpoint, key or scope is accepted.
  bool read_base_model = 2;
}

// Secret values are confined to the authenticated TLS step channel; they are
// never persisted in execution snapshots, projections, logs or ordinary YAML.
message TemporaryStorageCredentials {
  string access_key_id = 1;
  string secret_access_key = 2;
  string session_token = 3;
  google.protobuf.Timestamp expires_at = 4;
  string storage_connection_id = 5;
  string bucket = 6;
  // prepare receives exactly the frozen input key; publish receives only the
  // execution's publication subtree. Exactly one of these fields is present.
  oneof scope {
    string object_key = 7;
    string object_prefix = 8;
  }
}

message GetStorageCredentialsResponse {
  ani.training.v1.ExecutionIdentity identity = 1;
  PipelineStep step = 2;
  TemporaryStorageCredentials credentials = 3;
}

// Ensure accepts only execution/authority references. ModelDev derives the
// TrainingInput and CRD from durable facts, never a caller-provided PodSpec.
message EnsureTrainingRequest {
  StepContext context = 1;
}

message ResourceRef {
  string api_version = 1;
  string kind = 2;
  string namespace_name = 3;
  string namespace_uid = 4;
  string name = 5;
  string uid = 6;
  string owner_uid = 7;
}

message ObservedCondition {
  string type = 1;
  // Absent means unknown. Consumers do not choose the first true condition.
  optional bool status = 2;
  string reason = 3;
  google.protobuf.Timestamp observed_at = 4;
}

message ResourceObservation {
  ResourceRef resource = 1;
  repeated ObservedCondition conditions = 2;
  optional int32 exit_code = 3;
  string node_name = 4;
  google.protobuf.Timestamp observed_at = 5;
  // Both present and absent API objects require independent writer assessment.
  bool api_object_present = 6;
}

message TrainingStatus {
  ani.training.v1.ExecutionIdentity identity = 1;
  ExternalCreateState create_state = 2;
  string deterministic_trainjob_name = 3;
  string create_request_sha256 = 4;
  ResourceRef trainjob = 5;
  repeated ResourceObservation resource_history = 6;
  ExecutionStates states = 7;
  google.protobuf.Timestamp observed_at = 8;
  // The original shared TRAIN/train-wait budget; absent for legacy CPU.
  google.protobuf.Timestamp training_admitted_at = 9;
  google.protobuf.Timestamp training_deadline_at = 10;
}

message EnsureTrainingResponse {
  TrainingStatus status = 1;
  bool replayed = 2;
}

message GetTrainingStatusRequest {
  StepContext context = 1;
}

message GetTrainingStatusResponse {
  TrainingStatus status = 1;
}

message PreparedInputCandidate {
  ani.training.v1.WorkspaceRef workspace = 1;
  ani.training.v1.ManifestRef prepared_manifest = 2;
  ani.training.v1.InputRef input = 3;
}

message PublishedFileCandidate {
  ani.training.v1.FileEntry file = 1;
  ani.training.v1.FixedObjectRef object = 2;
}

// This report is a claim to verify, not a publication receipt. The owner must
// independently confirm the upload/launcher completion and read remote bytes.
message PublicationCandidate {
  string logical_publication_key = 1;
  repeated PublishedFileCandidate files = 2;
  ani.training.v1.FixedObjectRef manifest_object = 3;
  ani.training.v1.FixedObjectRef bundle_object = 4;
  string upload_task_id = 5;
  string upload_pod_uid = 6;
}

message StepFailure {
  ErrorDetail failure = 1;
  repeated ani.training.v1.LogRef logs = 2;
}

message ReportStepResultRequest {
  StepContext context = 1;
  string report_id = 2;
  oneof result {
    PreparedInputCandidate prepared = 3;
    ani.training.v1.TrainingResult training_result = 4;
    PublicationCandidate publication = 5;
    StepFailure failure = 6;
  }
}

// Written only by ModelDev after service-side verification. Its existence
// does not imply that compute has been closed or that cleanup is permitted.
message VerifiedPublication {
  string publication_id = 1;
  ani.training.v1.ExecutionIdentity identity = 2;
  string logical_publication_key = 3;
  repeated VerifiedPublishedFile files = 4;
  ani.training.v1.FixedObjectRef manifest_object = 5;
  ani.training.v1.FixedObjectRef bundle_object = 6;
  google.protobuf.Timestamp remote_verified_at = 7;
  string verification_receipt_id = 8;
  UploadCompletionEvidence upload_completion = 9;
}

// Stored by the owner after observing the actual uploader/launcher completion,
// not accepted as a user or component assertion that bytes will be uploaded.
message UploadCompletionEvidence {
  string kfp_run_id = 1;
  string workflow_uid = 2;
  string task_id = 3;
  string pod_uid = 4;
  string uploader_container_name = 5;
  google.protobuf.Timestamp completed_at = 6;
  google.protobuf.Timestamp observed_at = 7;
}

message VerifiedPublishedFile {
  string artifact_id = 1;
  ani.training.v1.FileEntry file = 2;
  ani.training.v1.FixedObjectRef object = 3;
  google.protobuf.Timestamp remote_verified_at = 4;
}

message ReportStepResultResponse {
  bool replayed = 1;
  ExecutionStates states = 2;
  // Present only after actual remote verification and durable publication.
  VerifiedPublication publication = 3;
}

message RequestExecutionCloseRequest {
  StepContext context = 1;
  CloseReason reason = 2;
}

message RequestExecutionCloseResponse {
  uint64 close_generation = 1;
  CloseState close_state = 2;
  bool replayed = 3;
  google.protobuf.Timestamp accepted_at = 4;
}
