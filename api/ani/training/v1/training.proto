syntax = "proto3";

package ani.training.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/zhangzhe-ctrl/ani-modeldev-service/api/ani/training/v1;trainingv1";

// CPU-P01 only supports these capabilities. UNSPECIFIED is never a default.
enum ExecutionKind {
  EXECUTION_KIND_UNSPECIFIED = 0;
  EXECUTION_KIND_GENERAL_TRAINING = 1;
  EXECUTION_KIND_FINETUNING = 2;
}

enum DeliveryMode {
  DELIVERY_MODE_UNSPECIFIED = 0;
  DELIVERY_MODE_SAVE_ARTIFACTS = 1;
}

enum OutputKind {
  OUTPUT_KIND_UNSPECIFIED = 0;
  OUTPUT_KIND_CHECKPOINT = 1;
  OUTPUT_KIND_MERGED_HF_MODEL = 2;
}

enum TrainingOutcome {
  TRAINING_OUTCOME_UNSPECIFIED = 0;
  TRAINING_OUTCOME_SUCCEEDED = 1;
  TRAINING_OUTCOME_FAILED = 2;
}

enum CandidateStorageState {
  CANDIDATE_STORAGE_STATE_UNSPECIFIED = 0;
  CANDIDATE_STORAGE_STATE_WORKSPACE_ONLY = 1;
}

enum WorkspaceMode {
  WORKSPACE_MODE_UNSPECIFIED = 0;
  WORKSPACE_MODE_KFP_RUN_WORKSPACE = 1;
  WORKSPACE_MODE_EXECUTION_PVC = 2;
}

enum FileRole {
  FILE_ROLE_UNSPECIFIED = 0;
  FILE_ROLE_CHECKPOINT = 1;
  FILE_ROLE_MODEL_CONFIG = 2;
  FILE_ROLE_METRICS = 3;
  FILE_ROLE_SUMMARY = 4;
  FILE_ROLE_INPUT_MANIFEST = 5;
  FILE_ROLE_EXECUTION_MANIFEST = 6;
  FILE_ROLE_LOG = 7;
  FILE_ROLE_HF_MODEL = 8;
  FILE_ROLE_LORA_ADAPTER = 9;
  FILE_ROLE_EXPORT_REPORT = 10;
  FILE_ROLE_VERIFY_REPORT = 11;
  FILE_ROLE_SOURCE_METADATA = 12;
}

// Values are typed before canonical hashing. Decimal values use the contract's
// canonical decimal string, never binary floating point or shell fragments.
message Parameter {
  string name = 1;
  oneof value {
    string string_value = 2;
    int64 integer_value = 3;
    bool boolean_value = 4;
    string decimal_value = 5;
  }
}

message ExecutionIdentity {
  string operation_id = 1;
  string execution_id = 2;
  string execution_spec_hash = 3;
}

// An approved connection reference, not a user-provided endpoint or credential.
// version_id fixes a backend version; immutable_copy means the managed object
// is write-protected instead. Exactly one immutability proof is required;
// selecting immutable_copy with value false is invalid.
message FixedObjectRef {
  string storage_connection_id = 1;
  string bucket = 2;
  string key = 3;
  oneof immutability {
    string version_id = 4;
    bool immutable_copy = 5;
  }
  int64 size_bytes = 6;
  string sha256 = 7;
}

message InputRef {
  string input_version_id = 1;
  FixedObjectRef object = 2;
  string format = 3;
  string schema_version = 4;
  uint32 row_count = 5;
  uint32 feature_count = 6;
}

message RuntimeRef {
  string name = 1;
  string kind = 2;
  string api_group = 3;
  string content_sha256 = 4;
  // Actual Runtime target job names; never guessed from a controller default.
  repeated string target_jobs = 5;
}

// ProgramRef is the finetuning program identity. Its image_version_id stays
// reserved for the finetuning chain only; general training uses
// TrainingProgram below.
message ProgramRef {
  string image_version_id = 1;
  // Full immutable registry reference, including @sha256:<digest>.
  string image_digest = 2;
  repeated string command = 3;
  repeated string resolved_args = 4;
  repeated Parameter resolved_parameters = 5;
}

// TrainingPlatform is the resolved target platform of the selected image. It
// comes from pinned admission facts, never from the device name or image name.
message TrainingPlatform {
  string os = 1;
  string architecture = 2;
  string variant = 3;
}

// TrainingImageSelection is the frozen catalogue resolution of the training
// image. It never carries credentials; pull_secret_ref is only a Secret name.
message TrainingImageSelection {
  string image_id = 1;
  string scope = 2;
  // Authoritative registry authority from Resource. Never re-derived from the
  // reference by a consumer.
  string registry_authority = 3;
  // Fixed content digest as sha256:<64 lowercase hex>.
  string digest = 4;
  // Complete runnable reference, including @sha256:<digest>.
  string reference = 5;
  TrainingPlatform platform = 6;
  string protocol_version = 7;
  // Shared tenant pull Secret name derived offline from Resource's naming rule.
  string pull_secret_ref = 8;
}

// TrainingProgram is the general-training executable program. It is separate
// from ProgramRef so the finetuning chain keeps its own identity and hash.
message TrainingProgram {
  TrainingImageSelection image = 1;
  repeated string command = 2;
  repeated string resolved_args = 3;
  repeated Parameter resolved_parameters = 4;
}

message CPUResources {
  uint32 nodes = 1;
  uint32 processes_per_node = 2;
  int64 request_millicpu = 3;
  int64 limit_millicpu = 4;
  int64 request_memory_bytes = 5;
  int64 limit_memory_bytes = 6;
}

// This immutable contract can be frozen before a workspace exists. It must
// never acquire a PVC UID or KFP Run ID after execution_spec_hash is calculated.
message WorkspaceContract {
  WorkspaceMode mode = 1;
  string storage_class = 2;
  int64 capacity_bytes = 3;
  string input_subpath = 4;
  string training_subpath = 5;
  string reports_subpath = 6;
  string publication_subpath = 7;
}

// Runtime binding is separate from the immutable admission snapshot.
// Namespace and PVC UID must match actual objects, including on every reuse.
message WorkspaceRef {
  WorkspaceMode mode = 1;
  string namespace_name = 2;
  string namespace_uid = 3;
  string pvc_name = 4;
  string pvc_uid = 5;
  string input_subpath = 6;
  string training_subpath = 7;
  string reports_subpath = 8;
  string publication_subpath = 9;
}

message RequiredOutput {
  FileRole role = 1;
  string relative_path = 2;
  int64 max_size_bytes = 3;
  optional bool in_tar = 4;
}

message OutputContract {
  string schema_version = 1;
  OutputKind output_kind = 2;
  DeliveryMode delivery_mode = 3;
  repeated RequiredOutput required_files = 4;
  uint32 max_file_count = 5;
  int64 max_total_bytes = 6;
  bool create_tar_bundle = 7;
  optional int64 max_tar_bytes = 8;
}

// A hash always describes actual file bytes, not an object-store ETag.
// Paths are normalized relative POSIX paths: no absolute/traversal paths,
// duplicate entries, symlinks, hardlinks, or special files are accepted.
message FileEntry {
  string relative_path = 1;
  FileRole role = 2;
  int64 size_bytes = 3;
  string sha256 = 4;
}

message ManifestRef {
  string relative_path = 1;
  int64 size_bytes = 2;
  string sha256 = 3;
}

message Metric {
  string name = 1;
  string decimal_value = 2;
  optional int64 step = 3;
}

message LogRef {
  // Owner-issued reference to the original execution's actual training logs.
  string log_id = 1;
  string resource_uid = 2;
  string container_name = 3;
}

message TrainingInput {
  string schema_version = 1;
  ExecutionIdentity identity = 2;
  InputRef input = 3;
  ManifestRef prepared_manifest = 4;
  ProgramRef program = 5;
  RuntimeRef runtime = 6;
  CPUResources resources = 7;
  WorkspaceRef workspace = 8;
  OutputContract output_contract = 9;
  google.protobuf.Timestamp deadline_at = 10;
}

// A candidate from training/collection. This message never proves publication
// and is never sufficient by itself to issue a download authorization.
message TrainingResult {
  string schema_version = 1;
  ExecutionIdentity identity = 2;
  TrainingOutcome outcome = 3;
  google.protobuf.Timestamp completed_at = 4;
  OutputKind output_kind = 5;
  CandidateStorageState storage_state = 6;
  WorkspaceRef workspace = 7;
  string relative_output_path = 8;
  repeated FileEntry files = 9;
  ManifestRef manifest = 10;
  repeated Metric metrics = 11;
  repeated LogRef logs = 12;
  string failure_reason = 13;
}
