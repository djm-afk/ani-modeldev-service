# Explicit template; the default -conf configs loader ignores this directory.
# Supply all mounted references and real ENV values before selecting this file.
# A ready listener means the runtime is assembled, not that training is accepted.
server:
  grpc:
    network: tcp
    addr: "${COMMAND_LISTEN_ADDRESS}"
    timeout: 10s
  admin:
    network: tcp
    addr: "${ADMIN_LISTEN_ADDRESS}"
    timeout: 1s
  shutdown_timeout: 10s
command:
  database_url_file: "${DATABASE_URL_FILE}"
  client_ca_file: "${GOVERNANCE_CLIENT_CA_FILE}"
  certificate_file: "${COMMAND_CERTIFICATE_FILE}"
  private_key_file: "${COMMAND_PRIVATE_KEY_FILE}"
  governance_dns_name: "${GOVERNANCE_DNS_NAME}"
  # Presence enables the ModelDev -> Model business mTLS dependency. Every
  # material is required and the artifact plan is part of the block: a
  # connection that cannot describe one artifact would record every
  # registration as unavailable instead of performing it.
  model:
    endpoint: "${MODEL_GRPC_ENDPOINT}"
    ca_file: "${MODEL_CA_FILE}"
    client_dns_name: "${MODELDEV_CLIENT_DNS_NAME}"
    certificate_file: "${MODEL_CLIENT_CERTIFICATE_FILE}"
    private_key_file: "${MODEL_CLIENT_PRIVATE_KEY_FILE}"
    server_name: "${MODEL_SERVER_DNS_NAME}"
    actor: "${MODEL_AUDIT_ACTOR}"
    timeout: 30s
    # FileName and Format are the provider's own vocabulary for the archived
    # artifact; display_name/description/capabilities are the new-model branch
    # metadata. The frozen intent still fixes the target, version and bytes.
    artifact_plan:
      file_name: "${MODEL_ARTIFACT_FILE_NAME}"
      format: "${MODEL_ARTIFACT_FORMAT}"
      display_name: "${MODEL_ARTIFACT_DISPLAY_NAME}"
      description: "${MODEL_ARTIFACT_DESCRIPTION}"
      capabilities: ["${MODEL_ARTIFACT_CAPABILITY}"]
runtime:
  step:
    network: tcp
    addr: "${MANAGED_STEP_LISTEN_ADDRESS}"
    timeout: 30s
  certificate_file: "${MANAGED_STEP_CERTIFICATE_FILE}"
  private_key_file: "${MANAGED_STEP_PRIVATE_KEY_FILE}"
  kubernetes:
    endpoint: "${KUBERNETES_API_ENDPOINT}"
    ca_file: "${KUBERNETES_CA_FILE}"
    token_file: "${MODELDEV_CONTROL_TOKEN_FILE}"
  pipeline:
    endpoint: "${KFP_ENDPOINT}"
    ca_file: "${KFP_CA_FILE}"
    token_file: "${KFP_BOUND_CONTROL_TOKEN_FILE}"
  object_storage:
    endpoint: "${S3_ENDPOINT}"
    ca_file: "${S3_CA_FILE}"
    region: "${S3_REGION}"
    # JSON: restricted ordinary IAM access_key_id/secret_access_key and
    # sts_bindings (tenant_id, purpose, connection_id, bucket, prefix).
    # Only the control service mounts this identity; steps obtain scoped STS
    # sessions through their current authenticated workload RPC.
    credentials_file: "${S3_CREDENTIALS_FILE}"
    connection_id: "${PUBLICATION_STORAGE_CONNECTION_ID}"
    max_object_bytes: "${MAX_PUBLICATION_OBJECT_BYTES}"
  # JSON: tenant_id, complete environment snapshot, and owner configuration.
  binding_file: "${PIPELINE_DISPATCH_BINDING_FILE}"
  binding_sha256: "${PIPELINE_DISPATCH_BINDING_SHA256}"
  token_audience: "${MANAGED_STEP_TOKEN_AUDIENCE}"
  api_timeout: 30s
  dispatch_interval: 1s
  dispatch_batch_size: 10
