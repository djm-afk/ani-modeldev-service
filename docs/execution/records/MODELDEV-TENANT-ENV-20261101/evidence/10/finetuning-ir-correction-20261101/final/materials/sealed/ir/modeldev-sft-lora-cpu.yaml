# PIPELINE DEFINITION
# Name: ft
# Inputs:
#    environment_binding_id: str
#    execution_id: str
#    namespace_uid: str
#    spec_hash: str
components:
  comp-close:
    executorLabel: exec-close
    inputDefinitions:
      parameters:
        candidate:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        execution_id:
          parameterType: STRING
        run_id:
          parameterType: STRING
        spec_hash:
          parameterType: STRING
  comp-collect:
    executorLabel: exec-collect
    inputDefinitions:
      parameters:
        execution_id:
          parameterType: STRING
        run_id:
          parameterType: STRING
        spec_hash:
          parameterType: STRING
  comp-createpvc:
    executorLabel: exec-createpvc
    inputDefinitions:
      parameters:
        access_modes:
          description: 'AccessModes to request for the provisioned PVC. May

            be one or more of ``''ReadWriteOnce''``, ``''ReadOnlyMany''``, ``''ReadWriteMany''``,
            or

            ``''ReadWriteOncePod''``. Corresponds to `PersistentVolumeClaim.spec.accessModes
            <https://kubernetes.io/docs/concepts/storage/persistent-volumes/#access-modes>`_.'
          parameterType: LIST
        annotations:
          description: Annotations for the PVC's metadata. Corresponds to `PersistentVolumeClaim.metadata.annotations
            <https://kubernetes.io/docs/reference/kubernetes-api/config-and-storage-resources/persistent-volume-claim-v1/#PersistentVolumeClaim>`_.
          isOptional: true
          parameterType: STRUCT
        pvc_name:
          description: 'Name of the PVC. Corresponds to `PersistentVolumeClaim.metadata.name
            <https://kubernetes.io/docs/reference/kubernetes-api/config-and-storage-resources/persistent-volume-claim-v1/#PersistentVolumeClaim>`_.
            Only one of ``pvc_name`` and ``pvc_name_suffix`` can

            be provided.'
          isOptional: true
          parameterType: STRING
        pvc_name_suffix:
          description: 'Prefix to use for a dynamically generated name, which

            will take the form ``<argo-workflow-name>-<pvc_name_suffix>``. Only one

            of ``pvc_name`` and ``pvc_name_suffix`` can be provided.'
          isOptional: true
          parameterType: STRING
        size:
          description: The size of storage requested by the PVC that will be provisioned.
            For example, ``'5Gi'``. Corresponds to `PersistentVolumeClaim.spec.resources.requests.storage
            <https://kubernetes.io/docs/reference/kubernetes-api/config-and-storage-resources/persistent-volume-claim-v1/#PersistentVolumeClaimSpec>`_.
          parameterType: STRING
        storage_class_name:
          defaultValue: ''
          description: 'Name of StorageClass from which to provision the PV

            to back the PVC. ``None`` indicates to use the cluster''s default

            storage_class_name. Set to ``''''`` for a statically specified PVC.'
          isOptional: true
          parameterType: STRING
        volume_name:
          description: 'Pre-existing PersistentVolume that should back the

            provisioned PersistentVolumeClaim. Used for statically

            specified PV only. Corresponds to `PersistentVolumeClaim.spec.volumeName
            <https://kubernetes.io/docs/reference/kubernetes-api/config-and-storage-resources/persistent-volume-claim-v1/#PersistentVolumeClaimSpec>`_.'
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      parameters:
        name:
          parameterType: STRING
  comp-exit-handler-1:
    dag:
      tasks:
        close:
          cachingOptions: {}
          componentRef:
            name: comp-close
          dependentTasks:
          - createpvc
          - publish
          - register
          inputs:
            parameters:
              candidate:
                taskOutputParameter:
                  outputParameterKey: candidate
                  producerTask: publish
              execution_id:
                componentInputParameter: pipelinechannel--execution_id
              run_id:
                runtimeValue:
                  constant: '{{$.pipeline_job_uuid}}'
              spec_hash:
                componentInputParameter: pipelinechannel--spec_hash
          retryPolicy:
            backoffDuration: 0s
            backoffFactor: 2.0
            backoffMaxDuration: 3600s
          taskInfo:
            name: close
        collect:
          cachingOptions: {}
          componentRef:
            name: comp-collect
          dependentTasks:
          - createpvc
          - verify
          inputs:
            parameters:
              execution_id:
                componentInputParameter: pipelinechannel--execution_id
              run_id:
                runtimeValue:
                  constant: '{{$.pipeline_job_uuid}}'
              spec_hash:
                componentInputParameter: pipelinechannel--spec_hash
          retryPolicy:
            backoffDuration: 0s
            backoffFactor: 2.0
            backoffMaxDuration: 3600s
          taskInfo:
            name: collect
        createpvc:
          cachingOptions: {}
          componentRef:
            name: comp-createpvc
          dependentTasks:
          - workspace-name
          inputs:
            parameters:
              access_modes:
                runtimeValue:
                  constant:
                  - ReadWriteMany
              pvc_name:
                taskOutputParameter:
                  outputParameterKey: name
                  producerTask: workspace-name
              size:
                runtimeValue:
                  constant: 64Gi
              storage_class_name:
                runtimeValue:
                  constant: ani-cephfs
          retryPolicy:
            backoffDuration: 0s
            backoffFactor: 2.0
            backoffMaxDuration: 3600s
          taskInfo:
            name: createpvc
        export:
          cachingOptions: {}
          componentRef:
            name: comp-export
          dependentTasks:
          - createpvc
          - train-wait
          inputs:
            parameters:
              execution_id:
                componentInputParameter: pipelinechannel--execution_id
              run_id:
                runtimeValue:
                  constant: '{{$.pipeline_job_uuid}}'
              spec_hash:
                componentInputParameter: pipelinechannel--spec_hash
          retryPolicy:
            backoffDuration: 0s
            backoffFactor: 2.0
            backoffMaxDuration: 3600s
          taskInfo:
            name: export
        prepare:
          cachingOptions: {}
          componentRef:
            name: comp-prepare
          dependentTasks:
          - createpvc
          inputs:
            parameters:
              execution_id:
                componentInputParameter: pipelinechannel--execution_id
              pvc_name:
                taskOutputParameter:
                  outputParameterKey: name
                  producerTask: createpvc
              run_id:
                runtimeValue:
                  constant: '{{$.pipeline_job_uuid}}'
              spec_hash:
                componentInputParameter: pipelinechannel--spec_hash
          retryPolicy:
            backoffDuration: 0s
            backoffFactor: 2.0
            backoffMaxDuration: 3600s
          taskInfo:
            name: prepare
        publish:
          cachingOptions: {}
          componentRef:
            name: comp-publish
          dependentTasks:
          - collect
          - createpvc
          inputs:
            parameters:
              execution_id:
                componentInputParameter: pipelinechannel--execution_id
              run_id:
                runtimeValue:
                  constant: '{{$.pipeline_job_uuid}}'
              spec_hash:
                componentInputParameter: pipelinechannel--spec_hash
          retryPolicy:
            backoffDuration: 0s
            backoffFactor: 2.0
            backoffMaxDuration: 3600s
          taskInfo:
            name: publish
        register:
          cachingOptions: {}
          componentRef:
            name: comp-register
          dependentTasks:
          - createpvc
          - publish
          inputs:
            parameters:
              candidate:
                taskOutputParameter:
                  outputParameterKey: candidate
                  producerTask: publish
              execution_id:
                componentInputParameter: pipelinechannel--execution_id
              run_id:
                runtimeValue:
                  constant: '{{$.pipeline_job_uuid}}'
              spec_hash:
                componentInputParameter: pipelinechannel--spec_hash
          retryPolicy:
            backoffDuration: 0s
            backoffFactor: 2.0
            backoffMaxDuration: 3600s
          taskInfo:
            name: register
        train-wait:
          cachingOptions: {}
          componentRef:
            name: comp-train-wait
          dependentTasks:
          - prepare
          inputs:
            parameters:
              execution_id:
                componentInputParameter: pipelinechannel--execution_id
              run_id:
                runtimeValue:
                  constant: '{{$.pipeline_job_uuid}}'
              spec_hash:
                componentInputParameter: pipelinechannel--spec_hash
          retryPolicy:
            backoffDuration: 0s
            backoffFactor: 2.0
            backoffMaxDuration: 3600s
          taskInfo:
            name: train-wait
        verify:
          cachingOptions: {}
          componentRef:
            name: comp-verify
          dependentTasks:
          - createpvc
          - export
          inputs:
            parameters:
              execution_id:
                componentInputParameter: pipelinechannel--execution_id
              run_id:
                runtimeValue:
                  constant: '{{$.pipeline_job_uuid}}'
              spec_hash:
                componentInputParameter: pipelinechannel--spec_hash
          retryPolicy:
            backoffDuration: 0s
            backoffFactor: 2.0
            backoffMaxDuration: 3600s
          taskInfo:
            name: verify
        workspace-name:
          cachingOptions: {}
          componentRef:
            name: comp-workspace-name
          inputs:
            parameters:
              execution_id:
                componentInputParameter: pipelinechannel--execution_id
          retryPolicy:
            backoffDuration: 0s
            backoffFactor: 2.0
            backoffMaxDuration: 3600s
          taskInfo:
            name: workspace-name
    inputDefinitions:
      parameters:
        pipelinechannel--execution_id:
          parameterType: STRING
        pipelinechannel--spec_hash:
          parameterType: STRING
  comp-export:
    executorLabel: exec-export
    inputDefinitions:
      parameters:
        execution_id:
          parameterType: STRING
        run_id:
          parameterType: STRING
        spec_hash:
          parameterType: STRING
  comp-finalize-close:
    executorLabel: exec-finalize-close
    inputDefinitions:
      parameters:
        execution_id:
          parameterType: STRING
        run_id:
          parameterType: STRING
        spec_hash:
          parameterType: STRING
  comp-prepare:
    executorLabel: exec-prepare
    inputDefinitions:
      parameters:
        execution_id:
          parameterType: STRING
        pvc_name:
          parameterType: STRING
        run_id:
          parameterType: STRING
        spec_hash:
          parameterType: STRING
  comp-publish:
    executorLabel: exec-publish
    inputDefinitions:
      parameters:
        execution_id:
          parameterType: STRING
        run_id:
          parameterType: STRING
        spec_hash:
          parameterType: STRING
    outputDefinitions:
      parameters:
        candidate:
          parameterType: STRING
  comp-register:
    executorLabel: exec-register
    inputDefinitions:
      parameters:
        candidate:
          parameterType: STRING
        execution_id:
          parameterType: STRING
        run_id:
          parameterType: STRING
        spec_hash:
          parameterType: STRING
  comp-train-wait:
    executorLabel: exec-train-wait
    inputDefinitions:
      parameters:
        execution_id:
          parameterType: STRING
        run_id:
          parameterType: STRING
        spec_hash:
          parameterType: STRING
  comp-verify:
    executorLabel: exec-verify
    inputDefinitions:
      parameters:
        execution_id:
          parameterType: STRING
        run_id:
          parameterType: STRING
        spec_hash:
          parameterType: STRING
  comp-workspace-name:
    executorLabel: exec-workspace-name
    inputDefinitions:
      parameters:
        execution_id:
          parameterType: STRING
    outputDefinitions:
      parameters:
        name:
          parameterType: STRING
