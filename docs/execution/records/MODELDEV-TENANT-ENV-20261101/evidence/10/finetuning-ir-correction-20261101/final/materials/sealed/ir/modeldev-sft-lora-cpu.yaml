pipelineInfo:
  name: ft
root:
  dag:
    tasks:
      exit-handler-1:
        componentRef:
          name: comp-exit-handler-1
        inputs:
          parameters:
            pipelinechannel--execution_id:
              componentInputParameter: execution_id
            pipelinechannel--spec_hash:
              componentInputParameter: spec_hash
        taskInfo:
          name: managed-execution
      finalize-close:
        cachingOptions: {}
        componentRef:
          name: comp-finalize-close
        dependentTasks:
        - exit-handler-1
        inputs:
          parameters:
            execution_id:
              componentInputParameter: execution_id
            run_id:
              runtimeValue:
                constant: '{{$.pipeline_job_uuid}}'
            spec_hash:
              componentInputParameter: spec_hash
        retryPolicy:
          backoffDuration: 0s
          backoffFactor: 2.0
          backoffMaxDuration: 3600s
        taskInfo:
          name: close-finalizer
        triggerPolicy:
          strategy: ALL_UPSTREAM_TASKS_COMPLETED
  inputDefinitions:
    parameters:
      environment_binding_id:
        parameterType: STRING
      execution_id:
        parameterType: STRING
      namespace_uid:
        parameterType: STRING
      spec_hash:
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.0
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-close:
          activeDeadlineSeconds: '14400'
          configMapAsVolume:
          - configMapName: modeldev-step-owner
            configMapNameParameter:
              runtimeValue:
                constant: modeldev-step-owner
            mountPath: /etc/modeldev-step
            optional: false
          emptyDirMounts:
          - mountPath: /tmp
            sizeLimit: 1Gi
            volumeName: component-tmp
          fieldPathAsEnv:
          - fieldPath: metadata.name
            name: ANI_POD_NAME
          - fieldPath: metadata.uid
            name: ANI_POD_UID
          - fieldPath: metadata.namespace
            name: ANI_POD_NAMESPACE
          podMetadata:
            annotations:
              ani.modeldev/component-resources-sha256: 129b718a98ff93fe435bb78143bc1b9f6e7b9a2cc804389160fb54d1be5225f9
            labels:
              ani.modeldev/admission-profile: modeldev-sft-lora-cpu
              ani.modeldev/step-role: close
          pvcMount:
          - mountPath: /workspace
            pvcNameParameter:
              taskOutputParameter:
                outputParameterKey: name
                producerTask: createpvc
            taskOutputParameter:
              outputParameterKey: name
              producerTask: createpvc
          securityContext:
            runAsGroup: '10001'
            runAsNonRoot: true
            runAsUser: '10001'
        exec-collect:
          activeDeadlineSeconds: '14400'
          configMapAsVolume:
          - configMapName: modeldev-step-owner
            configMapNameParameter:
              runtimeValue:
                constant: modeldev-step-owner
            mountPath: /etc/modeldev-step
            optional: false
          emptyDirMounts:
          - mountPath: /tmp
            sizeLimit: 2Gi
            volumeName: component-tmp
