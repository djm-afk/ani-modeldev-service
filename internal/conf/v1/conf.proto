syntax = "proto3";

package conf.v1;

option go_package = "github.com/zhangzhe-ctrl/ani-modeldev-service/internal/conf/v1;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  // Absent keeps the unready runtime shell. Presence requires every input and
  // assembles the real Governance command listener without plaintext fallback.
  GovernanceCommand command = 2;
  // Presence assembles the managed execution main flow alongside command.
  ManagedRuntime runtime = 3;
}

message ManagedRuntime {
  Server.GRPC step = 1;
  string certificate_file = 2;
  string private_key_file = 3;
  HTTPSWorkloadConnection kubernetes = 4;
  HTTPSWorkloadConnection pipeline = 5;
  ObjectStorageConnection object_storage = 6;
  // JSON PipelineDispatchBinding with the tenant, complete frozen environment
  // and owner configuration. It contains no credentials and is SHA256 pinned.
  string binding_file = 7;
  string binding_sha256 = 8;
  string token_audience = 9;
  google.protobuf.Duration api_timeout = 10;
  google.protobuf.Duration dispatch_interval = 11;
  uint32 dispatch_batch_size = 12;
}

message HTTPSWorkloadConnection {
  string endpoint = 1;
  string ca_file = 2;
  // Mounted current workload credential, never a forwarded user token.
  string token_file = 3;
}

message ObjectStorageConnection {
  string endpoint = 1;
  string ca_file = 2;
  string region = 3;
  string credentials_file = 4;
  string connection_id = 5;
  int64 max_object_bytes = 6;
  // Optional explicit streaming I/O budget. Absence preserves api_timeout.
  // Every request still consumes its original caller/stage deadline.
  google.protobuf.Duration streaming_timeout = 7;
}

message GovernanceCommand {
  // A mounted secret file containing the restricted runtime PostgreSQL URL.
  // Connection values and private keys are never stored in ordinary YAML.
  string database_url_file = 1;
  string client_ca_file = 2;
  string certificate_file = 3;
  string private_key_file = 4;
  string governance_dns_name = 5;
  // Presence enables candidate resolution from explicitly pinned mounted
  // materials. It does not establish environment or business readiness.
  AdmissionResolution admission_resolution = 6;
  // Absence keeps FINETUNING disabled and Model reads/writes unavailable.
  ModelConnection model = 7;
}

// ModelConnection is the explicit ModelDev -> Model business mTLS dependency.
// Every material is required when presence is declared; there is no plaintext,
// ambient or borrowed-Governance fallback. The receiving Model service must
// separately register this caller identity and allow the exact RPCs used.
message ModelConnection {
  // Literal host:port of the Model business mTLS listener.
  string endpoint = 1;
  string ca_file = 2;
  // The client certificate must present exactly this one DNS SAN.
  string client_dns_name = 3;
  string certificate_file = 4;
  string private_key_file = 5;
  // The exact DNS SAN required on the Model server certificate.
  string server_name = 6;
  // Stable audit actor this caller asserts. Authorization never depends on it.
  string actor = 7;
  google.protobuf.Duration timeout = 8;
}

message AdmissionResolution {
  string catalogue_directory = 1;
  repeated AdmissionFactsFile facts_files = 2;
}

message AdmissionFactsFile {
  string path = 1;
  string sha256 = 2;
}

message Server {
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }

  message Admin {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }

  GRPC grpc = 1;
  Admin admin = 2;
  google.protobuf.Duration shutdown_timeout = 3;
}
